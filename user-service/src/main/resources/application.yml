server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: user-service
  # Креды БД лежат отдельно от кода: путь задаётся через CREDENTIALS_FILE,
  # внутри — обычный properties-файл с DB_USER/DB_PASS.
  config:
    import: optional:file:${CREDENTIALS_FILE:./config/secrets/db-credentials.properties}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:postgres}
    password: "${DB_PASS:}"
    hikari:
      pool-name: user-service-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jooq:
    sql-dialect: POSTGRES
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.jooq.tools.LoggerListener: WARN
