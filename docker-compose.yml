services:
  db:
    image: postgres:16
    container_name: habit-postgres
    environment:
      POSTGRES_DB: app
      # Логин не секрет; пароль читается из файла-секрета.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - habit-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      # Креды приходят файлом, а не переменными окружения.
      CREDENTIALS_FILE: /run/secrets/db-credentials.properties
    volumes:
      # Spring определяет формат файла по расширению, поэтому монтируем именно *.properties.
      - ./config/secrets/db-credentials.properties:/run/secrets/db-credentials.properties:ro
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - habit-network

  habit-service:
    build:
      context: .
      dockerfile: habit-service/Dockerfile
    container_name: habit-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      CREDENTIALS_FILE: /run/secrets/db-credentials.properties
      USER_SERVICE_URL: http://user-service:8081
    volumes:
      - ./config/secrets/db-credentials.properties:/run/secrets/db-credentials.properties:ro
    expose:
      - "8082"
    depends_on:
      db:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - habit-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8081
      HABIT_SERVICE_URL: http://habit-service:8082
      TRACKING_SERVICE_URL: http://tracking-service:8083
      PORT: 8080
      CORS_ALLOWED_ORIGIN: "${CORS_ALLOWED_ORIGIN:-*}"
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-10s}
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      habit-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - habit-network

  tracking-service:
    build:
      context: .
      dockerfile: tracking-service/Dockerfile
    container_name: tracking-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/app
      CREDENTIALS_FILE: /run/secrets/db-credentials.properties
      HABIT_SERVICE_URL: http://habit-service:8082
    volumes:
      - ./config/secrets/db-credentials.properties:/run/secrets/db-credentials.properties:ro
    expose:
      - "8083"
    depends_on:
      db:
        condition: service_healthy
      habit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - habit-network


volumes:
  db_data:

networks:
  habit-network:
    driver: bridge

# Файлы с секретами не попадают в git (см. .gitignore).
# Скопируйте *.example и подставьте свои значения.
secrets:
  postgres_password:
    file: ./config/secrets/postgres-password.txt
