server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: habit-service
  config:
    import: optional:file:${CREDENTIALS_FILE:./config/secrets/db-credentials.properties}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:postgres}
    password: "${DB_PASS:}"
    hikari:
      pool-name: habit-service-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jooq:
    sql-dialect: POSTGRES
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}
  lifecycle:
    timeout-per-shutdown-phase: 20s

clients:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.jooq.tools.LoggerListener: WARN
